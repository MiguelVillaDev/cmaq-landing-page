<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="./src/output.css" />
    <script src="./js/componente.js" type="module"></script>
    <title>Contacto C.MAQ</title>
  </head>
  <body class="font-inter">
    <div id="navbar"></div>
    <main>
      <section
        class="w-screen bg-[linear-gradient(135deg,white_50%,var(--color-back)_50%)] pt-14 md:h-screen md:pt-20"
      >
        <div
          class="container-cmaq h-full w-full justify-center md:flex md:flex-row md:pt-0"
        >
          <div class="flex shrink-0 items-center justify-center md:w-1/2">
            <img class="" src="./img/logo/CMAQ-full-color.webp" alt="logo" />
          </div>
          <div
            class="flex w-full flex-col justify-center gap-4 rounded-lg bg-white px-4 py-2 md:my-2 md:w-1/2 md:shadow-lg"
          >
            <div class="md:pt-2">
              <p class="text-steel text-xl">CONTACTO</p>
              <h2 class="text-3xl font-bold text-balance">
                RELLENA EL SIGUIENTE FORMULARIO
              </h2>
            </div>
            <form
              action="https://formspree.io/f/mykvjrgq"
              method="post"
              class="flex flex-col gap-4"
            >
              <div class="flex flex-col">
                <label for="nombre">Nombre y Apellido</label>
                <input
                  id="nombre"
                  type="text"
                  name="nombre"
                  required
                  class="border-navy rounded-md border px-2 py-1.5"
                />
              </div>

              <div class="flex flex-col">
                <label for="empresa">Empresa</label>
                <input
                  id="empresa"
                  type="text"
                  name="empresa"
                  class="border-navy rounded-md border px-2 py-1.5"
                />
              </div>

              <div class="flex flex-col">
                <label for="pais">País</label>
                <input
                  id="pais"
                  type="text"
                  name="pais"
                  required
                  class="border-navy rounded-md border px-2 py-1.5"
                />
              </div>

              <div class="flex flex-col">
                <label for="correo">Correo</label>
                <input
                  id="correo"
                  type="email"
                  name="correo"
                  required
                  class="border-navy rounded-md border px-2 py-1.5"
                />
              </div>

              <div class="flex flex-col">
                <label for="numero">Celular o Teléfono</label>
                <input
                  id="numero"
                  type="number"
                  name="telefono"
                  required
                  class="border-navy rounded-md border px-2 py-1.5"
                />
              </div>

              <div class="flex flex-col">
                <label for="mensaje">Mensaje</label>
                <textarea
                  id="mensaje"
                  rows="2"
                  name="mensaje"
                  class="border-navy rounded-md border px-2 py-1.5"
                ></textarea>
              </div>
              <button
                type="submit"
                id="contactBtn"
                class="border-navy bg-steel w-full rounded-md border py-4 text-white transition-colors duration-300 hover:bg-[#4a6d8c]"
              >
                ENVIAR SOLICITUD
              </button>
              <p
                id="errorMsj"
                class="hidden text-center text-xs font-semibold text-red-400"
              >
                HUBO UN ERROR AL ENVIAR EL FORMULARIO, VUELVE A INTENTARLO.
              </p>
            </form>
          </div>
        </div>
      </section>
    </main>
    <footer class="bg-navy mx-auto w-screen">
      <div id="footer"></div>
    </footer>
  </body>
</html>
