<svg xmlns="http://www.w3.org/2000/svg" style="display: none;">

  <!-- ICONO 1 -->
  <symbol id="clipboard" viewBox="0 0 24 24" fill="none">
    <g stroke="currentColor" stroke-width="1" stroke-linecap="round" stroke-linejoin="round">
      <rect width="8" height="4" x="8" y="2" rx="1" ry="1" />
      <path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2" />
      <path d="M12 11h4" />
      <path d="M12 16h4" />
      <path d="M8 11h.01" />
      <path d="M8 16h.01" />
    </g>
  </symbol>

  <!-- ICONO 2 -->
  <symbol id="solar-panel" viewBox="32 18 62 70">
    <g stroke="currentColor" stroke-width="2.5" fill="none" stroke-linecap="round"
      stroke-linejoin="round">
      <!-- Panel frame -->
      <rect x="34" y="32" width="46" height="34" />

      <!-- Grid lines -->
      <line x1="34" y1="43" x2="80" y2="43" />
      <line x1="34" y1="54" x2="80" y2="54" />
      <line x1="49" y1="32" x2="49" y2="66" />
      <line x1="64" y1="32" x2="64" y2="66" />

      <!-- Stand -->
      <line x1="57" y1="66" x2="52" y2="84" />
      <line x1="57" y1="66" x2="62" y2="84" />
      <line x1="45" y1="84" x2="69" y2="84" />

      <!-- Lightning bolt -->
      <polyline points="89,34 84,44 90,44 85,54" />

      <!-- Small rays -->
      <line x1="43" y1="24" x2="43" y2="30" />
      <line x1="57" y1="20" x2="57" y2="30" />
      <line x1="71" y1="24" x2="71" y2="30" />
    </g>

  </symbol>

  <symbol id="environment" viewBox="0 0 24 24" fill="none">
