      <line x1="21" y1="66" x2="193" y2="66" />
      <line x1="72" y1="20" x2="58" y2="90" />
      <line x1="110" y1="20" x2="105" y2="90" />
      <line x1="148" y1="20" x2="152" y2="90" />
      <line x1="45" y1="91" x2="45" y2="100" />
      <line x1="33" y1="100" x2="56" y2="100" />
      <line x1="165" y1="90" x2="165" y2="100" />
